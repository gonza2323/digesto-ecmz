# === PROPIEDADES COMUNES ===
spring.application.name=digesto
# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5433/digesto
spring.datasource.username=postgres
spring.datasource.password=postgres
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Archivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Correo (SMTP). Si no se configura MAIL_HOST, los envíos se registran en el log y no se envían.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Log Spring Security internal events
logging.level.org.springframework.security=DEBUG
# Log HTTP filter chain
logging.level.org.springframework.security.web=DEBUG
# Batching
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
# === PROPIEDADES PROPIAS DE LA APLICACIÓN ===
# Tokens
app.auth.password-reset.duration-minutes=60
# CORS
app.cors-origins=https://digesto.mzapata.uncuyo.edu.ar,http://localhost:5173
# URLs
app.frontend-url=https://digesto.mzapata.uncuyo.edu.ar
app.api-url=https://api.digesto.mzapata.uncuyo.edu.ar
# Almacenamiento de los PDF en disco
app.storage.dir=${STORAGE_DIR:./data/archivos}
# Correo
app.mail.from=${MAIL_FROM:digesto@mzapata.uncuyo.edu.ar}
# Backups (rutas a los binarios de PostgreSQL)
app.backup.pg-dump=${PG_DUMP:pg_dump}
app.backup.psql=${PSQL:psql}
app.backup.alert-months=6
